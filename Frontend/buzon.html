<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón de Sugerencias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo Institución">
        </div>
        
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">&#9776;</button>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="horario.html">Mi Horario</a>
            <a href="maestros.html">Directorio de Maestros</a>
            <a href="buzon.html" class="activo">Buzón de Sugerencias</a>
            <a href="soporte.html">Soporte</a>
        </nav>

        <div class="perfil">
            <img src="img/usuario.png" alt="Usuario">
            <span>Nombre del Alumno</span>
        </div>
    </header>

    <div class="buzon-container">
        <h1>Envía tú sugerencia</h1>
        <hr class="buzon-divider">

        <form class="buzon-form" action="#" method="POST">
            <div class="input-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">
            </div>

            <div class="input-group">
                <label for="grupo">Grupo y Grado:</label>
                <input type="text" id="grupo" name="grupo">
            </div>

            <div class="input-group">
                <label for="departamento">Departamento o área de mejora:</label>
                <input type="text" id="departamento" name="departamento" placeholder="Ej. Infraestructura de edificios">
            </div>

            <div class="input-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" placeholder="Ej. Aire acondicionado averiado en salón 11 Edificio Docencia 1"></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </div>

    <script src="js/nav.js"></script>
</body>
</html>
