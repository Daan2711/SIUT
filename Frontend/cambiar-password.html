<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyUTSC - Cambiar Contraseña</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="img/logo.png" alt="Logo UTSC" class="logo">
            </div>
            <h1>MyUTSC</h1>
            <p id="tituloCambio" class="bienvenida">Cambia tu contraseña temporal</p>
            <p id="textoCambio" class="cambio-texto">
                Por seguridad, debes establecer una contraseña personal antes de continuar.
            </p>
            <form id="cambiarForm">
                <!-- Solo en el cambio voluntario (desde el menú de perfil) -->
                <div id="grupoActual" class="input-group" hidden>
                    <label for="password_actual">Contraseña actual</label>
                    <input
                        type="password"
                        id="password_actual"
                        autocomplete="current-password"
                        placeholder="Tu contraseña de hoy">
                </div>
                <div class="input-group">
                    <label for="nueva_password">Nueva contraseña</label>
                    <input
                        type="password"
                        id="nueva_password"
                        autocomplete="new-password"
                        placeholder="Mínimo 8 caracteres"
                        required>
                </div>
                <div class="input-group">
                    <label for="confirmar_password">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirmar_password"
                        autocomplete="new-password"
                        placeholder="Repite tu nueva contraseña"
                        required>
                </div>
                <button type="submit" class="btn-login">
                    GUARDAR CONTRASEÑA
                </button>
            </form>
            <a id="volverCambio" class="cambio-volver" href="/" hidden>← Volver sin cambiar</a>
        </div>
    </div>
    <script src="js/csrf.js"></script>
    <script src="js/mostrar-password.js"></script>
    <script src="js/cambiar-password.js"></script>
</body>
</html>
