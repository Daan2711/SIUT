<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyUTSC - Cambiar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="img/logo.png" alt="Logo UTSC" class="logo">
            </div>
            <h1>MyUTSC</h1>
            <p class="bienvenida">Cambia tu contraseña temporal</p>
            <p style="font-size:0.85rem; color:#666; text-align:center; margin-bottom:1rem;">
                Por seguridad, debes establecer una contraseña personal antes de continuar.
            </p>
            <form id="cambiarForm">
                <div class="input-group">
                    <label>Nueva contraseña</label>
                    <input 
                        type="password" 
                        id="nueva_password"
                        placeholder="Mínimo 8 caracteres"
                        required>
                </div>
                <div class="input-group">
                    <label>Confirmar contraseña</label>
                    <input 
                        type="password" 
                        id="confirmar_password"
                        placeholder="Repite tu nueva contraseña"
                        required>
                </div>
                <button type="submit" class="btn-login">
                    GUARDAR CONTRASEÑA
                </button>
            </form>
        </div>
    </div>
    <script src="js/cambiar-password.js"></script>
</body>
</html>
