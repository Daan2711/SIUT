<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón de Sugerencias | SIUT</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
      <a class="logo" href="index.html" aria-label="Ir al inicio"><img src="img/logo.png" alt="UTSC"></a>
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuPrincipal"><span></span><span></span><span></span></button>
      <nav id="menuPrincipal" class="nav-principal" aria-label="Menú principal">
          <a href="index.html" data-icono="inicio">Inicio</a>
          <a href="horario.html" data-icono="horario">Mi horario</a>
          <a href="maestros.html" data-icono="maestros">Maestros</a>
          <a href="buzon.html" data-icono="empleos">Empleos</a>
          <a href="sugerencias.html" data-icono="buzon" class="activo" aria-current="page">Buzón</a>
          <a href="soporte.html" data-icono="soporte">Soporte</a>
      </nav>
      <div class="perfil">
        <button id="perfilBoton" class="perfil-boton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="perfilMenu">
          <span class="perfil-avatar" aria-hidden="true">{{iniciales}}</span>
          <span class="perfil-texto"><span id="nombreAlumno" class="perfil-nombre">Nombre del Alumno</span><span class="perfil-rol">{{rol}}</span></span>
          <span class="perfil-flecha" aria-hidden="true"></span>
        </button>
        <div id="perfilMenu" class="perfil-menu" hidden>
          <div class="perfil-menu-cabecera"><strong>Nombre del Alumno</strong><span>{{rol}}</span></div>
          <a href="/cambiar-password" class="perfil-menu-item perfil-menu-item--neutro" data-icono="candado">Cambiar contraseña</a>
          <button id="cerrarSesion" class="perfil-menu-item" type="button" data-icono="salir">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="buzon-container">
        <h1>Formulario de reporte</h1>
        <hr class="buzon-divider">
        <form class="buzon-form" id="formularioReporte" action="#" method="POST">
            <div class="input-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" maxlength="100"
                       placeholder="Ej. Nombre Apellido Apellido" required>
            </div>
            <div class="input-group">
                <label for="grupo">Grupo y grado:</label>
                <input type="text" id="grupo" name="grupo" maxlength="50"
                       placeholder="Ej. IDGS9E" required>
            </div>
            <div class="input-group">
                <label for="departamento">Departamento o área de mejora:</label>
                <select id="departamento" name="departamento" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Sistemas">Sistemas</option>
                    <option value="Infraestructura">Infraestructura</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                    <option value="Escolares">Escolares</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div class="input-group" id="grupoOtroDepartamento" style="display:none;">
                <label for="otroDepartamento">Especifica el departamento o área:</label>
                <input type="text" id="otroDepartamento" name="otroDepartamento" maxlength="100"
                       placeholder="Ej. Cafetería">
            </div>
            <div class="input-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" maxlength="2000"
                          placeholder="Ej. Aire acondicionado averiado en salón 11, Edificio Docencia 1"
                          required></textarea>
            </div>
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>

        <section class="mis-notificaciones" aria-labelledby="tituloNotificaciones">
            <h2 id="tituloNotificaciones">Mis notificaciones</h2>
            <p class="notificaciones-ayuda">Aquí ves el estado de las sugerencias que enviaste y la respuesta del administrador.</p>
            <p id="contadorNotificaciones" class="notificaciones-ayuda">Cargando…</p>
            <div id="listaNotificaciones" aria-live="polite"></div>
        </section>
    </main>

    <!-- SweetAlert2 desde cdnjs (permitido por la CSP), con SRI verificado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"
            integrity="sha512-cAiOMQ6IleoiPyH2UGR2k9OCclUh6tFL6RMnFsH26pntGnKyNtjwFpD7CodlP/TvYz+F7vLoBJQmIgSvScdzQA=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/csrf.js"></script>
    <script src="js/buzon.js"></script>
    <script src="js/mis-sugerencias.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
