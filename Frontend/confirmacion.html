<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada - SIUT</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }
        .card{
            background:#b2dfdb;
            width:420px;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }
        .icono{
            font-size:60px;
            color:#2e7d32;
            margin-bottom:15px;
        }
        h1{
            color:#222;
            margin-bottom:15px;
        }
        p{
            color:#444;
            line-height:1.6;
            margin-bottom:25px;
        }
        button{
            background:#f5a623;
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:30px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:.3s;
        }
        button:hover{
            background:#dd9300;
        }
        .contador{
            margin-top:20px;
            color:#555;
            font-size:14px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icono">✔</div>
    <h1>¡Solicitud enviada correctamente!</h1>
    <p>
        Gracias por registrarte en el Sistema Integral Universitario de la UTSC.
        <br><br>
        Tu solicitud fue enviada con éxito.
        En breve nos pondremos en contacto contigo.
    </p>
    <button id="btnInicio">
        Regresar al inicio
    </button>
    <div class="contador">
        Serás redirigido automáticamente en <span id="segundos">5</span> segundos...
    </div>
</div>
<script src="js/confirmacion.js"></script>
</body>
</html>
