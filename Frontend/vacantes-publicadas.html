<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacantes publicadas | SIUT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo"><img src="img/logo.png" alt="Logo UTSC"></div>
    <div class="titulo-header">Cargar empleos</div>
    <div class="perfil"><img src="img/usuario.png" alt="Usuario"><span id="nombreAlumno">Nombre del Alumno</span></div>
  </header>

  <main class="empleos-page">
    <section class="empleos-hero">
      <div>
        <p class="empleos-eyebrow">PUBLICACIÓN DE OPORTUNIDADES</p>
        <h1>Vacantes publicadas</h1>
        <p>Estas son las vacantes disponibles actualmente para la comunidad UTSC, con su fecha de publicación.</p>
      </div>
    </section>

    <div class="empleos-list-heading">
      <div><h2>Vacantes publicadas</h2><p id="contadorPublicadas">Cargando…</p></div>
    </div>

    <section id="listaPublicadas" class="empleos-grid" aria-live="polite"></section>
    <p id="sinPublicadas" class="sin-resultados" hidden>Aún no hay vacantes publicadas.</p>

    <div class="publicadas-acciones">
      <a class="btn-empleo-primary btn-volver" href="cargar-vacantes.html">Volver al inicio</a>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/vacantes-publicadas.js"></script>
</body>
</html>
