<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal UTSC - Mi Horario</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
            integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="UTSC">
        </div>
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuPrincipal">&#9776;</button>
        <nav id="menuPrincipal">
            <a href="index.html">Inicio</a>
            <a class="activo" href="horario.html">Mi Horario</a>
            <a href="maestros.html">Directorio de Maestros</a>
            <a href="buzon.html">Buscar empleos</a>
            <a href="sugerencias.html">Buzón de sugerencias</a>
            <a href="soporte.html">Soporte</a>

        <div class="perfil">
            <img src="img/usuario.png" alt="Usuario">
            <span>Nombre del Alumno</span>
        </div>

    <main class="contenedor">
        <div class="titulo-pagina">
            <h1>Mi Horario</h1>
            <p>Consulta tu horario escolar actualizado.</p>
            
            <button id="btn-pdf" style="margin-top: 10px; padding: 10px 15px; cursor: pointer;">

            </button>
        </div>

        <div class="horario-imagen" id="area-pdf">
            <img src="img/horario.png" alt="Horario Escolar" style="width: 100%; display: block;">
        </div>
    </main>

    <script src="js/horario-pdf.js"></script>
  <script src="js/nav.js"></script>
