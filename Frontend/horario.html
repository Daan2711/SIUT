<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal UTSC - Mi Horario</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
            integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

    <header class="encabezado">
      <a class="logo" href="index.html" aria-label="Ir al inicio"><img src="img/logo.png" alt="UTSC"></a>
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuPrincipal"><span></span><span></span><span></span></button>
      <nav id="menuPrincipal" class="nav-principal" aria-label="Menú principal">
          <a href="index.html" data-icono="inicio">Inicio</a>
          <a href="horario.html" data-icono="horario" class="activo" aria-current="page">Mi horario</a>
          <a href="maestros.html" data-icono="maestros">Maestros</a>
          <a href="buzon.html" data-icono="empleos">Empleos</a>
          <a href="sugerencias.html" data-icono="buzon">Buzón</a>
          <a href="soporte.html" data-icono="soporte">Soporte</a>
      </nav>
      <div class="perfil">
        <button id="perfilBoton" class="perfil-boton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="perfilMenu">
          <span class="perfil-avatar" aria-hidden="true">{{iniciales}}</span>
          <span class="perfil-texto"><span id="nombreAlumno" class="perfil-nombre">Nombre del Alumno</span><span class="perfil-rol">{{rol}}</span></span>
          <span class="perfil-flecha" aria-hidden="true"></span>
        </button>
        <div id="perfilMenu" class="perfil-menu" hidden>
          <div class="perfil-menu-cabecera"><strong>Nombre del Alumno</strong><span>{{rol}}</span></div>
          <a href="/cambiar-password" class="perfil-menu-item perfil-menu-item--neutro" data-icono="candado">Cambiar contraseña</a>
          <button id="cerrarSesion" class="perfil-menu-item" type="button" data-icono="salir">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="contenedor">
        <div class="titulo-pagina">
            <h1>Mi Horario</h1>
            <p>Consulta tu horario escolar actualizado.</p>
            
            <button id="btn-pdf" style="margin-top: 10px; padding: 10px 15px; cursor: pointer;">
                Descargar Horario en PDF
            </button>
        </div>

        <div class="horario-imagen" id="area-pdf">
            <img src="img/horario.png" alt="Horario Escolar" style="width: 100%; display: block;">
        </div>
    </main>

    <script src="js/csrf.js"></script>
    <script src="js/horario-pdf.js"></script>
  <script src="js/nav.js"></script>

</body>
</html>
