<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal UTSC - Soporte</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="encabezado">
      <a class="logo" href="index.html" aria-label="Ir al inicio"><img src="img/logo.png" alt="UTSC"></a>
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuPrincipal"><span></span><span></span><span></span></button>
      <nav id="menuPrincipal" class="nav-principal" aria-label="Menú principal">
          <a href="index.html" data-icono="inicio">Inicio</a>
          <a href="horario.html" data-icono="horario">Mi horario</a>
          <a href="maestros.html" data-icono="maestros">Maestros</a>
          <a href="buzon.html" data-icono="empleos">Empleos</a>
          <a href="sugerencias.html" data-icono="buzon">Buzón</a>
          <a href="soporte.html" data-icono="soporte" class="activo" aria-current="page">Soporte</a>
      </nav>
      <div class="perfil">
        <button id="perfilBoton" class="perfil-boton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="perfilMenu">
          <span class="perfil-avatar" aria-hidden="true">{{iniciales}}</span>
          <span class="perfil-texto"><span id="nombreAlumno" class="perfil-nombre">Nombre del Alumno</span><span class="perfil-rol">{{rol}}</span></span>
          <span class="perfil-flecha" aria-hidden="true"></span>
        </button>
        <div id="perfilMenu" class="perfil-menu" hidden>
          <div class="perfil-menu-cabecera"><strong>Nombre del Alumno</strong><span>{{rol}}</span></div>
          <button id="cerrarSesion" class="perfil-menu-item" type="button" data-icono="salir">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="contenedor">

        <div class="titulo-pagina">
            <h1>Contactos de Soporte</h1>
        </div>

        <div class="tarjetas-soporte-flex">

            <!-- CORREOS -->
            <div class="tarjeta-soporte">

                <div class="circulo-icono">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="datos-soporte">
                    <p>
                        <a href="mailto:utscsoporte@virtual.utsc.edu.mx">
                            utscsoporte@virtual.utsc.edu.mx
                        </a>
                    </p>

                    <p>
                        <a href="mailto:utscbuzon@virtual.utsc.edu.mx">
                            utscbuzon@virtual.utsc.edu.mx
                        </a>
                    </p>
                </div>

            </div>

            <!-- TELÉFONOS -->
            <div class="tarjeta-soporte">

                <div class="circulo-icono">
                    <i class="fa-solid fa-phone"></i>
                </div>

                <div class="datos-soporte">

                    <p>
                        <a href="tel:+528126563592">
                            (81) 2656-3592
                        </a>
                    </p>

                    <p>
                        <a href="tel:+528145769230">
                            (81) 4576-9230
                        </a>
                    </p>

                </div>

            </div>

            <!-- UBICACIÓN -->
            <div class="tarjeta-soporte">

                <div class="circulo-icono">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div class="datos-soporte">

                    <p>
                        <a href="https://www.google.com/maps/search/?api=1&query=Universidad+Tecnologica+de+Santa+Catarina"
                            target="_blank"
                            rel="noopener noreferrer">

                            Carr. Monterrey - Saltillo Km. 61.5,
                            Bosques de Santa Catarina,
                            66359 Santa Catarina, N.L.

                        </a>
                    </p>

                </div>

            </div>

        </div>

    </main>

  <script src="js/nav.js"></script>

</body>

</html>
